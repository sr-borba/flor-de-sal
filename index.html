<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flor de Sal Bistrô & Bar</title>
  <style>
    :root {
      --fs-escuro: #1A0E06;
      --fs-dourado: #c7a453;
      --fs-branco: #FAFAF8;
      --fs-areia: #F5EDD8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      color: var(--fs-branco);
      background: var(--fs-escuro);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 560px);
    }

    p {
      margin: 0 0 1.5rem;
      color: rgba(250, 250, 248, 0.72);
      line-height: 1.7;
    }

    h1 {
      margin: 0 0 1rem;
      color: var(--fs-areia);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 400;
      line-height: 1.05;
    }

    a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 0.875rem 1.25rem;
      color: var(--fs-escuro);
      background: var(--fs-dourado);
      border-radius: 4px;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-decoration: none;
      text-transform: uppercase;
    }

    a:focus-visible {
      outline: 2px solid var(--fs-branco);
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Flor de Sal Bistrô & Bar</h1>
    <p>A landing page principal está em preparação. O Design System do projeto já está disponível para consulta.</p>
    <a href="/designsystem/">Acessar Design System</a>
  </main>
</body>
</html>
